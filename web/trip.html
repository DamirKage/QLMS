<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QLMS — Сапарды бақылау</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .track-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .track-header { padding: 16px 20px; background: #fff; border-bottom: 1px solid var(--qlms-border); }
    .track-header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .track-header .brand .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--qlms-blue); }
    .track-status { padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--qlms-border); display: flex; flex-direction: column; gap: 6px; }
    .track-status .row { display: flex; align-items: center; gap: 12px; }
    .track-status .destination { font-size: 15px; font-weight: 600; color: var(--qlms-text); }
    .track-status .deadline { font-size: 12px; color: var(--qlms-text-muted); }
    #trackMap { flex: 1; min-height: 320px; }
    .track-footer { padding: 12px 20px; font-size: 12px; color: var(--qlms-text-muted); text-align: center; background: #fff; }
    .track-state { padding: 60px 24px; text-align: center; color: var(--qlms-text-muted); }
    .badge.ACTIVE { background: #e6f4ea; color: #1e7e34; }
    .badge.ARRIVED { background: #e6f4ea; color: #1e7e34; }
    .badge.ALERTED { background: #fdecea; color: #c62828; }
    .badge.CANCELLED { background: #eceff1; color: #607d8b; }
  </style>
</head>
<body>
  <div class="track-shell">
    <div class="track-header">
      <div class="brand"><span class="dot"></span> QLMS — Walk me home</div>
    </div>

    <div id="trackStatusBar" class="track-status" hidden>
      <div class="row">
        <span id="trackBadge" class="badge ACTIVE">—</span>
        <span id="trackDeadline" class="deadline"></span>
      </div>
      <div id="trackDestination" class="destination"></div>
    </div>

    <div id="trackMap" hidden></div>

    <div id="trackEmpty" class="track-state">Жүктелуде…</div>

    <div class="track-footer">Бұл сілтеме тек осы сапардың орны мен мәртебесін көрсетеді — жеке деректер көрсетілмейді.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/trip.js"></script>
</body>
</html>
